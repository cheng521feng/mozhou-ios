     iPad 版 = 手机那套界面 + ipad.css（平板版式）+ ipad.js（外接键盘），没有桌面版的发布功能。 -->

<!-- 首屏外观：在样式表生效前就把 html.light 打上，冷启动不会先闪一下 -->
<script>
(function () {
  try {
    // 默认深墨黑（品牌底色）。只有用户明确选了「浅色」、或选了「跟随系统」且系统是浅色，
    // 才走纸白那一套；没存过偏好时不再跟随系统 —— 冷启动第一眼必须是品牌色。
    var t = localStorage.getItem('mz_theme');
    var light = (t === 'light') || (t === 'system' && window.matchMedia
      && window.matchMedia('(prefers-color-scheme: light)').matches);
    if (light) document.documentElement.classList.add('light');
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', light ? '#f2f1ee' : '#0c0d0f');
    var s = document.querySelector('meta[name=color-scheme]');
    if (s) s.setAttribute('content', light ? 'light' : 'dark');
  } catch (e) { /* 忽略 */ }
})();
</script>
<!-- 开屏看门狗：js/css 半路没加载全（别的软件抢了同一个端口、网卡抽风）时，
     以前就是永久停在「正在连接…」；现在会自己摆一块「重新加载」出来，点一下重来。
     只在「确实有资源加载失败」或「停了很久还没起来」时才出现，界面一旦正常起来就自动撤掉。 -->
<script>
(function () {
  window.__mzFail = 0;
  window.__mzT0 = Date.now();
  var ORIG = '正在连接…';
  var timer = 0;
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (!t || !t.tagName) return;
    if (t.tagName === 'SCRIPT') { window.__mzFail++; return; }
    if (t.tagName === 'LINK' && t.rel === 'stylesheet') window.__mzFail++;
  }, true);
  function splash() {
    var s = document.getElementById('splash');
    return (s && !s.classList.contains('gone')) ? s : null;
  }
  function clearBoard() {
    var s = splash();
    if (!s) return;
    var b = s.querySelector('.sp-retry');
    if (b && b.parentNode) b.parentNode.removeChild(b);
    var m = document.getElementById('splashMsg');
    if (m) m.textContent = ORIG;
  }
  function board(msg) {
    if (window.__mzBooted) return;
    var s = splash();
    if (!s) return;
    var m = document.getElementById('splashMsg');
    if (m) m.textContent = msg;
    if (s.querySelector('.sp-retry')) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'sp-retry';
    b.textContent = '重新加载';
    b.style.cssText = 'margin-top:18px;padding:9px 24px;border:0;border-radius:999px;'
      + 'background:var(--accent,#2f6bff);color:#fff;font:inherit;font-size:15px;cursor:pointer;';
    b.addEventListener('click', function () { location.reload(); });
    s.appendChild(b);
  }
  timer = setInterval(function () {
    if (window.__mzBooted) { clearBoard(); clearInterval(timer); return; }
    if (window.__mzFail) board('资源没加载全，点一下重新加载');
    else if (Date.now() - window.__mzT0 > 20000) board('还在启动…一直停着就点一下重试');
  }, 1000);
})();
</script>

<!-- 接上触控板 / 鼠标时：把滚轮接到横滑条上（选书条 / 筛选条都算）。手指左右滑本来就能划。 -->
<script>
(function () {
  if (!window.MZ_NO_401_REDIRECT) return;
  function hbox(el) {
    while (el && el.nodeType === 1 && el !== document.body) {
      var st = getComputedStyle(el);
      if ((st.overflowX === 'auto' || st.overflowX === 'scroll') && el.scrollWidth > el.clientWidth + 2) return el;
      el = el.parentElement;
    }
    return null;
  }
  document.addEventListener('wheel', function (e) {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;   /* 本来就是横向的，别插手 */
    var el = hbox(e.target);
    if (!el) return;
    el.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive: false });
})();
</script>


<!-- 外接键盘的 Alt+1~4 切页（⌘1~4 在 ipad.js 里）。没有外接键盘时这段完全不影响触屏。 -->
<script>
(function () {
  if (!window.MZ_NO_401_REDIRECT) return;          /* 只在电脑端那份生效 */
  var ORDER = ['books', 'write', 'jobs', 'me'];

  function openLayer() {
    /* 从最上面那一层开始关：模态 → 动作菜单 → 抽屉 */
    var ids = ['maskModal', 'maskActions', 'maskSheet'];
    for (var i = 0; i < ids.length; i++) {
      var m = document.getElementById(ids[i]);
      if (m && !m.classList.contains('hidden')) return m;
    }
    return null;
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var m = openLayer();
      if (m) { m.click(); e.preventDefault(); }
      return;
    }
    if (!e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    var n = parseInt(e.key, 10);
    if (!(n >= 1 && n <= ORDER.length)) return;
    var tab = ORDER[n - 1];
    var btn = document.querySelector('.tab[data-tab="' + tab + '"]');
    if (btn) { btn.click(); e.preventDefault(); }
  });
})();
</script>
